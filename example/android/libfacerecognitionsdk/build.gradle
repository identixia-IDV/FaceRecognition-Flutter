// Consumes Identixia Face Recognition AAR (same as FaceRecognition-LivenessDetection-Android).
// Drop facerecognitionsdk.aar here from the Android Drive folder / App export.
def aar = file("facerecognitionsdk.aar")
if (!aar.exists()) {
    throw new GradleException(
        "Missing example/android/libfacerecognitionsdk/facerecognitionsdk.aar.\n" +
        "Copy it from FaceRecognition-LivenessDetection-Android/libfacerecognitionsdk/ or the Drive Android pack."
    )
}
configurations.maybeCreate("default")
artifacts.add("default", aar)
